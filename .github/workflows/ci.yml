name: CI

# Build and test on every push to main and every pull request. `neon-lsp` pulls the
# compiler in as a git dependency (`neon-compiler`), and the compiler depends on
# `neon-runtime`, whose build script drives a CMake build of the C runtime archives — so a
# C toolchain (cc + cmake, both preinstalled on ubuntu-latest) is on the critical path even
# though nothing here links the runtime.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Keyed on Cargo.lock, which pins the exact compiler revision, so the git dependency
      # is fetched and compiled once per lockfile change.
      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check C toolchain
        run: cc --version && cmake --version

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked
